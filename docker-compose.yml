version: '3.8'

services:
  # (Data Warehouse)
  mysql_dw:
    image: mysql:8.0
    container_name: mysql_dw
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: etl_project
    ports:
      - "3306:3306"

  # (Airflow)
  airflow:
    image: apache/airflow:2.8.2
    container_name: airflow_orquestador
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        pip install -r /requirements.txt
        airflow db migrate
        airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@ejemplo.com
        airflow webserver --port 8080 &
        airflow scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./requirements.txt:/requirements.txt
    ports:
      - "8080:8080"
    depends_on:
      - mysql_dw